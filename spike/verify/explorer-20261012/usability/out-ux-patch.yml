# task-27 UX 基线 overlay：钉场景与自有守护槽位（不改共享 profile）
- id: remote-wsl
  config:
    distro: debian-u8-1
    wslHome: /home/g
    cwd: /home/g/project/dsh1
    daemonPort: 8962

# remote-wsl-test profile 的用户层：只为让 headless app 能真跑起来（commandcode 作默认模型），
# 与 dsh-remote-wsl 插件本身无关。凭据走 credentials seam（COMMANDCODE_API_KEY），不写明文。
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      commandcode:
        displayName: CommandCode
        apiKeyEnv: COMMANDCODE_API_KEY
        api: openai-completions
        baseURL: https://api.commandcode.ai/provider/v1
        models:
          - id: deepseek/deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            input:
              - text
              - image
            maxTokens: 256000
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: commandcode
    model: deepseek/deepseek-v4.1-flash
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
