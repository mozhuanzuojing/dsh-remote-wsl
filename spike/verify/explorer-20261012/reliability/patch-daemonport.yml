# task-6 / INJ-A·D 用的 **--patch 覆盖层**（不改任何用户 profile）
#
# 用途：把本插件自有守护槽位钉在 task-6 端口段的 8972（daemonPortTries=3 ⇒ 8972/8973/8974）。
# 用法：
#   dsh --profile remote-wsl-test web --port 8971 --no-open --patch ./patch-daemonport.yml
# 先自查（必须先做，避免"以为覆盖了其实没有"）：
#   dsh --profile remote-wsl-test --patch ./patch-daemonport.yml --dump-config | Select-String -Pattern 'id: remote-wsl' -Context 0,6
#
# 形状照 p0-verify 在 remote-wsl-test-web 的 dump（第 1261–1266 行，注释 *patched by …\cordis.patch.yml*）。
# 若 dump 结果显示 config 没被合并/覆盖，按实际形状改本文件，并把 dump 落 out-A-00-dumpconfig.txt。
- id: remote-wsl
  name: dsh-remote-wsl
  config:
    distro: debian-u8-1
    daemonPort: 8972
    daemonPortTries: 3
