# dsh bundle layer: mount the dsh-remote-wsl plugin via the package root export.
# profile 里用 `link:` 依赖引用本包，行名用裸包名即可解析。
#
# 关于版本兼容（2026-10-27 实测修正）：宿主真正执行的兼容门是 package.json 的 **`engines.dsh`**
# （不满足 ⇒ 该 bundle 被拒绝加载，痕迹在 `skippedBundles` 与启动日志里，不是"静默禁用"，
# 且有版本豁免逃生口）。`dsh.compatibility.dshReleases` 与 `peerDependencies` 都不参与这个判定
# （对宿主 app.asar 全量扫描 `dshReleases` 命中 0 次），所以这里既不声明 peer，也不靠那个矩阵挡版本。
- insert:
    - id: remote-wsl
      name: 'dsh-remote-wsl'
      config:
        # 目标（distro / wslHome / cwd）**默认留空 = 自动探测**（0.3.3 起，见 README「配置」）：
        #   distro  ← `wsl -l -v` 里带 * 的默认发行版
        #   wslHome ← 该发行版登录用户的 $HOME
        #   cwd     ← 跟随 wslHome
        # 探测失败不会猜默认值：工具与 wsl_status 会明确提示"请在 cordis.patch.yml 里显式配置 distro"。
        # 想完全跳过探测（也避免探测时把未运行的发行版拉起），取消下面三行注释并改成自己的值：
        # distro: Ubuntu-24.04
        # wslHome: /home/you
        # cwd: /home/you
        # 空字符串 = 跟随桌面版本（读 primary-runtime/runtime.json 的 desktopVersion）
        dshVersion: ''
